version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: agrihive_postgres
    restart: always
    environment:
      POSTGRES_USER: agrihive
      POSTGRES_PASSWORD: SecurePassword123!
      POSTGRES_DB: agrihive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrihive_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8001:8001"
    depends_on:
      - db
    volumes:
      - ./backend/data:/app/data

  frontend:
    image: nginx:alpine
    container_name: agrihive_frontend
    restart: always
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "3000:80"

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: agrihive_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
