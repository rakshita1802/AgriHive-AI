version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: agrihive_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrihive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-agrihive}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrihive"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrihive_prod_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrihive_prod_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://agrihive:SecurePassword123!@db:5432/agrihive}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_prod_data:/app/data

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrihive_prod_celery_worker
    restart: always
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://agrihive:SecurePassword123!@db:5432/agrihive}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_prod_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agrihive_prod_frontend
    restart: always
    ports:
      - "3000:80"

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: agrihive_prod_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_prod_data:
  backend_prod_data:
